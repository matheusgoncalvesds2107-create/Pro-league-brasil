name: Build PLB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar PLB
        run: |
          rm -rf game
          mkdir -p game
          unzip -o PLB_GitHub_v0.7.zip -d game
          echo "Projeto extraido:"
          find game -maxdepth 3 -type f

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;36.1.0" \
            "platforms;android-36"

      - name: Criar debug keystore
        run: |
          keytool -genkeypair \
            -keystore "${{ github.workspace }}/game/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=PLB,C=BR"

      - name: Configurar keystore
        run: |
          sed -i \
            's|keystore/debug=""|keystore/debug="'"${{ github.workspace }}"'/game/debug.keystore"|' \
            game/export_presets.cfg

          echo "Keystore:"
          grep keystore game/export_presets.cfg

      - name: Corrigir ETC2 ASTC para Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("game/project.godot")
          texto = p.read_text()

          linha = "textures/vram_compression/import_etc2_astc=true"

          if linha not in texto:
              if "[rendering]" in texto:
                  texto = texto.replace(
                      "[rendering]",
                      "[rendering]\n" + linha,
                      1
                  )
              else:
                  texto += "\n[rendering]\n" + linha + "\n"

          p.write_text(texto)
          PY

          echo "Configuracao rendering:"
          grep -A10 '^\[rendering\]' game/project.godot

      - name: Gerar APK com Godot
        id: export
        uses: firebelley/godot-export@v7.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/game/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          relative_project_path: ./game
          presets_to_export: Android
          export_debug: true
          cache: true
          godot_verbose: true

      - name: Localizar APK
        run: |
          mkdir -p apk

          APK=$(find "${{ steps.export.outputs.build_directory }}" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find game -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "APK nao encontrado"
            exit 1
          fi

          echo "APK encontrado em:"
          echo "$APK"

          cp "$APK" apk/ProLeagueBrasil-v0.7.apk
          ls -lh apk/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: PLB-v0.7-APK
          path: apk/ProLeagueBrasil-v0.7.apk
          if-no-files-found: error
          retention-days: 30
