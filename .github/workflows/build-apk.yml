name: Build PLB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar PLB
        run: |
          rm -rf game
          mkdir -p game
          unzip -o PLB_GitHub_v0.7.zip -d game
          find game -maxdepth 3 -type f

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;36.1.0" \
            "platforms;android-36"

      - name: Criar debug keystore
        run: |
          keytool -genkeypair \
            -keystore "${{ github.workspace }}/game/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=PLB,C=BR"

      - name: Configurar Godot Android
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          sed -i \
            's|keystore/debug=""|keystore/debug="'"${{ github.workspace }}"'/game/debug.keystore"|' \
            game/export_presets.cfg

          sed -i \
            's|keystore/debug_user="androiddebugkey"|keystore/debug_user="androiddebugkey"|' \
            game/export_presets.cfg

          sed -i \
            's|keystore/debug_password="android"|keystore/debug_password="android"|' \
            game/export_presets.cfg

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          cat "$HOME/.config/godot/editor_settings-4.tres"
          grep keystore game/export_presets.cfg

      - name: Gerar APK com Godot
        id: export
        uses: firebelley/godot-export@v7.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/game/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          relative_project_path: ./game
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Localizar APK
        run: |
          mkdir -p apk

          APK=$(find "${{ steps.export.outputs.build_directory }}" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK nao encontrado"
            find "${{ steps.export.outputs.build_directory }}" -type f || true
            exit 1
          fi

          cp "$APK" apk/ProLeagueBrasil-v0.7.apk
          ls -lh apk/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: PLB-v0.7-APK
          path: apk/ProLeagueBrasil-v0.7.apk
          if-no-files-found: error
