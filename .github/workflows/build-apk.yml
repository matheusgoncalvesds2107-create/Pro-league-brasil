name: Build PLB v0.9 Humano

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar PLB v0.9
        run: |
          rm -rf game
          mkdir -p game
          unzip -o PLB_GitHub_v0.9_humano.zip -d game

          echo "Arquivos extraidos:"
          find game -maxdepth 3 -type f

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;36.1.0" \
            "platforms;android-36"

      - name: Criar debug keystore
        run: |
          keytool -genkeypair \
            -keystore "${{ github.workspace }}/game/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Pro League Brasil,C=BR"

      - name: Configurar Android e compatibilidade
        run: |
          python3 - <<'PY'
          from pathlib import Path

          preset = Path("game/export_presets.cfg")
          texto = preset.read_text()

          texto = texto.replace(
              'keystore/debug=""',
              'keystore/debug="' + str(Path.cwd() / "game/debug.keystore") + '"'
          )

          texto = texto.replace(
              "architectures/armeabi-v7a=false",
              "architectures/armeabi-v7a=true"
          )

          texto = texto.replace(
              "architectures/arm64-v8a=false",
              "architectures/arm64-v8a=true"
          )

          preset.write_text(texto)

          project = Path("game/project.godot")
          ptexto = project.read_text()

          linha = "textures/vram_compression/import_etc2_astc=true"

          if linha not in ptexto:
              if "[rendering]" in ptexto:
                  ptexto = ptexto.replace(
                      "[rendering]",
                      "[rendering]\n" + linha,
                      1
                  )
              else:
                  ptexto += "\n[rendering]\n" + linha + "\n"

          project.write_text(ptexto)
          PY

          echo "Arquiteturas:"
          grep "architectures/" game/export_presets.cfg || true

          echo "Keystore:"
          grep "keystore/debug" game/export_presets.cfg || true

          echo "Rendering:"
          grep -A10 '^\[rendering\]' game/project.godot || true

      - name: Gerar APK PLB v0.9
        id: export
        uses: firebelley/godot-export@v7.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/game/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          relative_project_path: ./game
          presets_to_export: Android
          export_debug: true
          cache: true
          godot_verbose: true

      - name: Localizar APK
        run: |
          mkdir -p apk

          APK=$(find "${{ steps.export.outputs.build_directory }}" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find game -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado"
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" apk/ProLeagueBrasil-v0.9-humano.apk

          ls -lh apk/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: PLB-v0.9-HUMANO-APK
          path: apk/ProLeagueBrasil-v0.9-humano.apk
          if-no-files-found: error
          retention-days: 30
